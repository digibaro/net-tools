openapi: 3.1.0
info:
  title: NetTools API
  version: 0.1.0
  description: |
    Backend for NetTools. Conventions (envelope, error codes, SSE) are described in docs/API_SPEC.md.
    Frontend types are generated from this file with `pnpm gen:api`.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      tags: [system]
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      tags: [system]
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, const: not_ready }
                  checks:
                    type: object
                    additionalProperties: { type: string }
  /v1/version:
    get:
      operationId: getVersion
      summary: Build information
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Error" }
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Tool availability, deployment mode and limits
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/Capabilities" }
        default: { $ref: "#/components/responses/Error" }
  /v1/echo:
    get:
      operationId: getEcho
      summary: The request as seen by the API (client IP, protocol, headers)
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/Echo" }
        default: { $ref: "#/components/responses/Error" }
  /v1/dns/lookup:
    get:
      operationId: dnsLookup
      summary: Query a record type against a resolver
      tags: [dns]
      x-capability: dns.lookup
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 253 } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/DnsRecordType" } }
        - { name: resolver, in: query, description: "system, a preset id (cloudflare, google, quad9, opendns), ip[:port], host[:port] or an https DoH URL", schema: { type: string, default: system } }
        - { name: transport, in: query, schema: { type: string, enum: [udp, tcp, dot, doh], default: udp } }
        - { name: dnssec, in: query, schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/Family" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/DnsLookup" }
        default: { $ref: "#/components/responses/Error" }
  /v1/dns/reverse:
    get:
      operationId: dnsReverse
      summary: PTR lookup with forward confirmation
      tags: [dns]
      x-capability: dns.reverse
      parameters:
        - { name: ip, in: query, required: true, schema: { type: string } }
        - { name: resolver, in: query, schema: { type: string, default: system } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/DnsReverse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/dns/caa:
    get:
      operationId: dnsCaa
      summary: CAA records with RFC 8659 tree climbing
      tags: [dns]
      x-capability: dns.caa
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: resolver, in: query, schema: { type: string, default: system } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/DnsCaa" }
        default: { $ref: "#/components/responses/Error" }
  /v1/dns/consistency:
    get:
      operationId: dnsConsistency
      summary: Compare SOA serials and NS sets across all authoritative servers
      tags: [dns]
      x-capability: dns.consistency
      parameters:
        - { name: zone, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/DnsConsistency" }
        default: { $ref: "#/components/responses/Error" }
  /v1/dns/propagation:
    get:
      operationId: dnsPropagation
      summary: The same query against many public resolvers, grouped by answer
      tags: [dns]
      x-capability: dns.propagation
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [A, AAAA, CNAME, MX, NS, TXT, SOA, CAA, SRV, PTR], default: A } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/DnsPropagation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/dns/trace/stream:
    get:
      operationId: dnsTraceStream
      summary: Iterative resolution from the root servers (SSE)
      description: |
        Server-Sent Events: `meta`, then one `step` event (DnsTraceStep) per server queried, then
        `done` ({summary: DnsTraceSummary, durationMs}) or `error` (ApiError). Validation errors are
        also delivered as an `error` event.
      tags: [dns]
      x-capability: dns.trace
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/DnsRecordType" } }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /v1/dns/encrypted:
    get:
      operationId: dnsEncrypted
      summary: Test a DNS-over-TLS or DNS-over-HTTPS endpoint
      tags: [dns]
      x-capability: dns.encrypted
      parameters:
        - { name: endpoint, in: query, required: true, description: "preset id, host[:port] / ip[:port] (DoT) or https URL (DoH)", schema: { type: string } }
        - { name: transport, in: query, schema: { type: string, enum: [dot, doh], default: dot } }
        - { name: name, in: query, schema: { type: string, default: example.com } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/DnsRecordType" } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 5, default: 3 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/DnsEncrypted" }
        default: { $ref: "#/components/responses/Error" }
  /v1/ping/stream:
    get:
      operationId: pingStream
      summary: ICMP echo with live replies (SSE)
      description: "Events: meta, reply (PingReply)*, done ({summary: PingSummary, durationMs}) or error."
      tags: [connectivity]
      x-capability: net.ping
      parameters:
        - { name: target, in: query, required: true, schema: { type: string } }
        - { name: count, in: query, description: "1..PING_MAX_COUNT", schema: { type: integer, default: 5 } }
        - { name: interval, in: query, description: "ms, PING_MIN_INTERVAL_MS..5000", schema: { type: integer, default: 1000 } }
        - { name: size, in: query, schema: { type: integer, minimum: 16, maximum: 1472, default: 56 } }
        - { $ref: "#/components/parameters/Family" }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /v1/tcping/stream:
    get:
      operationId: tcpingStream
      summary: Repeated TCP connects with timing (SSE)
      description: "Events: meta, reply|timeout (PingReply)*, done ({summary: PingSummary, durationMs}) or error."
      tags: [connectivity]
      x-capability: net.tcping
      parameters:
        - { name: target, in: query, required: true, schema: { type: string } }
        - { name: port, in: query, schema: { type: integer, minimum: 1, maximum: 65535, default: 443 } }
        - { name: count, in: query, schema: { type: integer, default: 5 } }
        - { name: interval, in: query, schema: { type: integer, default: 1000 } }
        - { $ref: "#/components/parameters/Family" }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /v1/traceroute/stream:
    get:
      operationId: tracerouteStream
      summary: Traceroute via mtr (3 probes per hop, SSE)
      description: "Events: meta, hop (TraceHop)*, done ({summary: {hops: TraceHop[]}, durationMs}) or error."
      tags: [connectivity]
      x-capability: net.traceroute
      parameters:
        - { name: target, in: query, required: true, schema: { type: string } }
        - { name: proto, in: query, schema: { type: string, enum: [icmp, udp, tcp], default: icmp } }
        - { name: port, in: query, description: "TCP mode only", schema: { type: integer, minimum: 1, maximum: 65535, default: 443 } }
        - { name: maxHops, in: query, description: "1..TRACEROUTE_MAX_HOPS", schema: { type: integer, default: 30 } }
        - { $ref: "#/components/parameters/Family" }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /v1/mtr/stream:
    get:
      operationId: mtrStream
      summary: MTR (continuous traceroute with per-hop statistics, SSE)
      description: "Events: meta, hop (TraceHop, throttled updates)*, done ({summary: {hops: TraceHop[]}, durationMs}) or error."
      tags: [connectivity]
      x-capability: net.mtr
      parameters:
        - { name: target, in: query, required: true, schema: { type: string } }
        - { name: proto, in: query, schema: { type: string, enum: [icmp, udp, tcp], default: icmp } }
        - { name: port, in: query, schema: { type: integer, minimum: 1, maximum: 65535, default: 443 } }
        - { name: maxHops, in: query, schema: { type: integer, default: 30 } }
        - { name: cycles, in: query, description: "1..MTR_MAX_CYCLES", schema: { type: integer, default: 10 } }
        - { $ref: "#/components/parameters/Family" }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /v1/port/check:
    get:
      operationId: portCheck
      summary: Check up to 10 TCP (or UDP, best effort) ports from the server
      tags: [connectivity]
      x-capability: net.portcheck
      parameters:
        - { name: target, in: query, required: true, schema: { type: string } }
        - { name: ports, in: query, required: true, description: "comma list and small ranges, at most 10 ports", schema: { type: string, examples: ["22,80,443"] } }
        - { name: proto, in: query, schema: { type: string, enum: [tcp, udp], default: tcp } }
        - { $ref: "#/components/parameters/Family" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/PortCheck" }
        default: { $ref: "#/components/responses/Error" }
components:
  parameters:
    Family:
      name: family
      in: query
      description: Restrict to IPv4 (4) or IPv6 (6)
      schema: { type: integer, enum: [0, 4, 6] }
  responses:
    Error:
      description: Error envelope
      headers:
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    OkEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, const: true }
        data: {}
        meta: { $ref: "#/components/schemas/Meta" }
    Meta:
      type: object
      properties:
        tool: { type: string, examples: [dns.lookup] }
        target:
          type: object
          required: [input]
          properties:
            input: { type: string }
            resolved: { type: array, items: { type: string } }
            used: { type: string }
        vantage: { type: string, examples: [server, globalping] }
        durationMs: { type: number }
        cached: { type: boolean }
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        error: { $ref: "#/components/schemas/ApiError" }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      enum:
        - INVALID_INPUT
        - TARGET_UNRESOLVABLE
        - TARGET_PRIVATE_DENIED
        - TARGET_BLOCKED
        - TOOL_DISABLED
        - PROVIDER_KEY_MISSING
        - TIMEOUT
        - RATE_LIMITED
        - BUSY
        - PROVIDER_ERROR
        - INTERNAL
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
    Version:
      type: object
      required: [version, commit, buildDate, goVersion]
      properties:
        version: { type: string }
        commit: { type: string }
        buildDate: { type: string }
        goVersion: { type: string }
    Capabilities:
      type: object
      required: [mode, tools, limits]
      properties:
        mode:
          type: object
          required: [profile, allowPrivateTargets, lan]
          properties:
            profile: { type: string, enum: [public, internal, homelab] }
            allowPrivateTargets: { type: boolean }
            lan: { type: boolean }
        tools:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Capability" }
        limits:
          type: object
          required: [pingMaxCount, pingMinIntervalMs, tracerouteMaxHops, mtrMaxCycles, portscanMaxPorts, iperfMaxSeconds, bulkMaxTargets]
          properties:
            pingMaxCount: { type: integer }
            pingMinIntervalMs: { type: integer }
            tracerouteMaxHops: { type: integer }
            mtrMaxCycles: { type: integer }
            portscanMaxPorts: { type: integer }
            iperfMaxSeconds: { type: integer }
            bulkMaxTargets: { type: integer }
    Capability:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        reason:
          type: string
          enum: [disabled_by_admin, provider_key_missing, requires_lan_mode, binary_missing]
    Echo:
      type: object
      required: [ip, family, protocol, scheme, method, userAgent, headers]
      properties:
        ip: { type: string }
        family: { type: integer, enum: [4, 6] }
        protocol: { type: string, examples: [HTTP/1.1] }
        scheme: { type: string, enum: [http, https] }
        method: { type: string }
        userAgent: { type: string }
        headers:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
    DnsRecordType:
      type: string
      enum: [A, AAAA, CNAME, MX, NS, TXT, SOA, SRV, CAA, PTR, DS, DNSKEY, HTTPS, SVCB, TLSA, NAPTR, ANY]
      default: A
    DnsRecord:
      type: object
      required: [name, type, ttl, class, data]
      properties:
        name: { type: string }
        type: { type: string }
        ttl: { type: integer }
        class: { type: string }
        data: { type: string }
    DnsFlags:
      type: object
      required: [aa, tc, rd, ra, ad, cd]
      properties:
        aa: { type: boolean }
        tc: { type: boolean }
        rd: { type: boolean }
        ra: { type: boolean }
        ad: { type: boolean }
        cd: { type: boolean }
    DnsLookup:
      type: object
      required: [name, type, resolver, transport, rcode, flags, answer, authority, additional, rttMs]
      properties:
        name: { type: string }
        type: { type: string }
        resolver: { type: string }
        transport: { type: string }
        rcode: { type: string, examples: [NOERROR, NXDOMAIN, SERVFAIL] }
        flags: { $ref: "#/components/schemas/DnsFlags" }
        answer: { type: array, items: { $ref: "#/components/schemas/DnsRecord" } }
        authority: { type: array, items: { $ref: "#/components/schemas/DnsRecord" } }
        additional: { type: array, items: { $ref: "#/components/schemas/DnsRecord" } }
        rttMs: { type: number }
    DnsReverse:
      type: object
      required: [ip, ptrName, resolver, rcode, names, rttMs]
      properties:
        ip: { type: string }
        ptrName: { type: string }
        resolver: { type: string }
        rcode: { type: string }
        rttMs: { type: number }
        names:
          type: array
          items:
            type: object
            required: [name, forwardAddresses, forwardConfirmed]
            properties:
              name: { type: string }
              forwardAddresses: { type: array, items: { type: string } }
              forwardConfirmed: { type: boolean }
    CaaRecord:
      type: object
      required: [flag, critical, tag, value]
      properties:
        flag: { type: integer }
        critical: { type: boolean }
        tag: { type: string }
        value: { type: string }
    DnsCaa:
      type: object
      required: [name, relevantName, steps, issue, issueWild, iodef, unknownCritical, resolver]
      properties:
        name: { type: string }
        relevantName: { type: string, description: "Where the effective CAA set was found; empty if none" }
        resolver: { type: string }
        issue: { type: array, items: { type: string } }
        issueWild: { type: array, items: { type: string } }
        iodef: { type: array, items: { type: string } }
        unknownCritical: { type: array, items: { type: string } }
        steps:
          type: array
          items:
            type: object
            required: [name, rcode, records]
            properties:
              name: { type: string }
              rcode: { type: string }
              records: { type: array, items: { $ref: "#/components/schemas/CaaRecord" } }
    DnsConsistency:
      type: object
      required: [zone, nameservers, servers, serialsConsistent, nsSetsConsistent, allAuthoritative]
      properties:
        zone: { type: string }
        nameservers: { type: array, items: { type: string } }
        serialsConsistent: { type: boolean }
        nsSetsConsistent: { type: boolean }
        allAuthoritative: { type: boolean }
        servers:
          type: array
          items:
            type: object
            required: [name, address, serial, mname, rname, authoritative, nsSet, rttMs, error]
            properties:
              name: { type: string }
              address: { type: string }
              serial: { type: [integer, "null"] }
              mname: { type: string }
              rname: { type: string }
              authoritative: { type: boolean }
              nsSet: { type: array, items: { type: string } }
              rttMs: { type: number }
              error: { type: string }
    DnsPropagation:
      type: object
      required: [name, type, rows, groups, consensus]
      properties:
        name: { type: string }
        type: { type: string }
        consensus: { type: boolean }
        groups:
          type: array
          items:
            type: object
            required: [answers, rcode, count]
            properties:
              answers: { type: array, items: { type: string } }
              rcode: { type: string }
              count: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [resolver, provider, location, address, rcode, answers, ttl, rttMs, error, group]
            properties:
              resolver: { type: string }
              provider: { type: string }
              location: { type: string }
              address: { type: string }
              rcode: { type: string }
              answers: { type: array, items: { type: string } }
              ttl: { type: [integer, "null"] }
              rttMs: { type: number }
              error: { type: string }
              group: { type: integer, description: "Index into groups; -1 when the resolver failed" }
    SseDone:
      type: object
      required: [summary, durationMs]
      properties:
        summary: {}
        durationMs: { type: number }
    DnsTraceStep:
      type: object
      required: [step, zone, server, address, rcode, aa, rttMs, answer, referral, note]
      properties:
        step: { type: integer }
        zone: { type: string }
        server: { type: string }
        address: { type: string }
        rcode: { type: string }
        aa: { type: boolean }
        rttMs: { type: number }
        answer: { type: array, items: { $ref: "#/components/schemas/DnsRecord" } }
        referral: { type: array, items: { type: string } }
        note: { type: string }
    DnsTraceSummary:
      type: object
      required: [steps, rcode, answers]
      properties:
        steps: { type: integer }
        rcode: { type: string }
        answers: { type: integer }
    DnsEncrypted:
      type: object
      required: [endpoint, transport, address, tls, queries, answer, minMs, avgMs, maxMs]
      properties:
        endpoint: { type: string }
        transport: { type: string }
        address: { type: string }
        minMs: { type: number }
        avgMs: { type: number }
        maxMs: { type: number }
        answer: { type: array, items: { $ref: "#/components/schemas/DnsRecord" } }
        queries:
          type: array
          items:
            type: object
            required: [rttMs, rcode, error]
            properties:
              rttMs: { type: number }
              rcode: { type: string }
              error: { type: string }
        tls:
          type: object
          required: [version, cipher, alpn, subject, issuer, notAfter, dnsNames, verified, verifyError, handshakeMs]
          properties:
            version: { type: string }
            cipher: { type: string }
            alpn: { type: string }
            subject: { type: string }
            issuer: { type: string }
            notAfter: { type: string }
            dnsNames: { type: array, items: { type: string } }
            verified: { type: boolean }
            verifyError: { type: string }
            handshakeMs: { type: number }
    PingReply:
      type: object
      required: [seq, from]
      properties:
        seq: { type: integer }
        rttMs: { type: number }
        ttl: { type: integer }
        from: { type: string }
        bytes: { type: integer }
        error: { type: string }
    PingSummary:
      type: object
      required: [sent, received, lossPct, minMs, avgMs, maxMs, stddevMs, jitterMs]
      properties:
        sent: { type: integer }
        received: { type: integer }
        lossPct: { type: number }
        minMs: { type: number }
        avgMs: { type: number }
        maxMs: { type: number }
        stddevMs: { type: number }
        jitterMs: { type: number }
    TraceHop:
      type: object
      required: [hop, ip, host, sent, recv, loss, lastMs, avgMs, bestMs, worstMs, stddevMs, rttMs, asn]
      properties:
        hop: { type: integer }
        ip: { type: string }
        host: { type: string }
        sent: { type: integer }
        recv: { type: integer }
        loss: { type: number, description: "percent" }
        lastMs: { type: number }
        avgMs: { type: number }
        bestMs: { type: number }
        worstMs: { type: number }
        stddevMs: { type: number }
        rttMs: { type: array, items: { type: number } }
        asn: { type: [integer, "null"] }
    PortCheck:
      type: object
      required: [target, address, rows]
      properties:
        target: { type: string }
        address: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [port, proto, state, service, rttMs, detail]
            properties:
              port: { type: integer }
              proto: { type: string }
              state: { type: string, enum: [open, closed, filtered, "open|filtered", error] }
              service: { type: string }
              rttMs: { type: number }
              detail: { type: string }
