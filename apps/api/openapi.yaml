          type: array
          items:
            type: object
            required: [server, query, text, truncated, error]
            properties:
              server: { type: string }
              query: { type: string }
              text: { type: string }
              truncated: { type: boolean }
              error: { type: string }
        parsed:
          type: object
          required: [registrar, created, updated, expires, status, nameservers, org, country, netRange]
          properties:
            registrar: { type: string }
            created: { type: string }
            updated: { type: string }
            expires: { type: string }
            status: { type: array, items: { type: string } }
            nameservers: { type: array, items: { type: string } }
            org: { type: string }
            country: { type: string }
            netRange: { type: string }
    RdapRecord:
