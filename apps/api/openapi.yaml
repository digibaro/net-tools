            required: [name, kind, evidence]
            properties:
              name: { type: string }
              kind: { type: string, enum: [cdn, waf, bot, hosting, cache, tls] }
              evidence: { type: array, items: { type: string } }
    CacheResult:
      type: object
      required: [url, status, cacheControl, directives, browserTtl, sharedTtl, ttlSource, browserCacheable, sharedCacheable, age, etag, lastModified, expires, vary, cacheStatus, repeat, findings]
      properties:
        url: { type: string }
        status: { type: integer }
        cacheControl: { type: string }
        browserTtl: { type: integer, description: seconds, -1 = not cacheable / unknown }
        sharedTtl: { type: integer }
        ttlSource: { type: string }
        browserCacheable: { type: boolean }
        sharedCacheable: { type: boolean }
        age: { type: string }
        etag: { type: string }
        lastModified: { type: string }
        expires: { type: string }
        vary: { type: string }
        cacheStatus: { type: string }
        directives:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
        repeat:
          oneOf:
            - { type: "null" }
            - type: object
              required: [sent, status, cacheStatus, age]
              properties:
                sent: { type: string }
                status: { type: integer }
                cacheStatus: { type: string }
                age: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [id, severity, detail]
            properties:
              id: { type: string }
              severity: { type: string, enum: [info, warn, bad] }
              detail: { type: string }
    MixedResult:
      type: object
      required: [url, status, contentType, bodyBytes, truncated, upgradeInsecureRequests, items, active, passive, forms, links, resources]
      properties:
        url: { type: string }
        status: { type: integer }
        contentType: { type: string }
        bodyBytes: { type: integer }
        truncated: { type: boolean }
        upgradeInsecureRequests: { type: boolean }
        active: { type: integer }
        passive: { type: integer }
        forms: { type: integer }
        links: { type: integer }
        resources: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [tag, attr, url, kind]
            properties:
              tag: { type: string }
              attr: { type: string }
              url: { type: string }
              kind: { type: string, enum: [active, passive, form, link] }
    ChainResult:
      type: object
      required: [certs, path, ordered, complete, trusted, verifyError, host, hostOk, notes]
      properties:
        path: { type: array, items: { type: integer } }
        ordered: { type: boolean }
        complete: { type: boolean }
        trusted: { type: boolean }
        verifyError: { type: string }
        host: { type: string }
        hostOk: { type: [boolean, "null"] }
        notes: { type: array, items: { type: string } }
        certs:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TlsCert"
              - type: object
                required: [role, source, inputIndex, signatureOk, expired, aia]
                properties:
                  role: { type: string, enum: [leaf, intermediate, root, extra] }
                  source: { type: string, enum: [input, aia] }
                  inputIndex: { type: integer }
                  signatureOk: { type: [boolean, "null"] }
                  expired: { type: boolean }
                  aia: { type: string }
    RouteHistory:
      type: object
      required: [resource, family, origins, collectors, seeing, fullTablePeers, queryStart, queryEnd, related]
      properties:
        resource: { type: string }
        family: { type: integer }
        seeing: { type: integer }
        fullTablePeers: { type: integer }
        queryStart: { type: string }
        queryEnd: { type: string }
        related: { type: integer }
        origins:
          type: array
          items:
            type: object
            required: [asn, name, current, prefixes]
            properties:
              asn: { type: integer }
              name: { type: string }
              current: { type: boolean }
              prefixes:
                type: array
                items:
                  type: object
                  required: [prefix, firstSeen, lastSeen, current, maxPeers, periods]
                  properties:
                    prefix: { type: string }
                    firstSeen: { type: string }
                    lastSeen: { type: string }
                    current: { type: boolean }
                    maxPeers: { type: number }
                    periods: { type: integer }
        collectors:
          type: array
          items:
            type: object
            required: [name, city, country, peers, notSeeing, fullTables]
            properties:
              name: { type: string }
              city: { type: string }
              country: { type: string }
              peers: { type: integer }
              notSeeing: { type: integer }
              fullTables: { type: integer }
    GraphNode:
      type: object
      required: [asn, name, power]
      properties:
        asn: { type: integer }
        name: { type: string }
        power: { type: integer }
    NeighbourGraph:
      type: object
      required: [asn, name, upstreams, downstreams, uncertain, upstreamTotal, downstreamTotal, uncertainTotal]
      properties:
        asn: { type: integer }
        name: { type: string }
        upstreams: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        downstreams: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        uncertain: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        upstreamTotal: { type: integer }
        downstreamTotal: { type: integer }
        uncertainTotal: { type: integer }
    RoaCoverage:
      type: object
      required: [asn, name, prefixes, roas, valid, invalid, notFound, unchecked, validator, generated]
      properties:
        asn: { type: integer }
        name: { type: string }
        valid: { type: integer }
        invalid: { type: integer }
        notFound: { type: integer }
        unchecked: { type: integer }
        validator: { type: string }
        generated: { type: string }
        prefixes:
          type: array
          items:
            type: object
            required: [prefix, status, reason, roa]
            properties:
              prefix: { type: string }
              status: { type: string, enum: [valid, invalid, not-found, unchecked] }
              reason: { type: string }
              roa: { type: string }
        roas:
          type: array
          items:
            type: object
            required: [prefix, maxLength, ta, used, loose]
            properties:
              prefix: { type: string }
              maxLength: { type: integer }
              ta: { type: string }
              used: { type: boolean }
              loose: { type: boolean }
    PeeringPort:
      type: object
      required: [speedMbps, ipv4, ipv6, rsPeer]
      properties:
        speedMbps: { type: integer }
        ipv4: { type: string }
        ipv6: { type: string }
        rsPeer: { type: boolean }
    PeeringSide:
      type: object
      required: [asn, name, found, policy, ixCount, facilityCount, peeringdbUrl]
      properties:
        asn: { type: integer }
        name: { type: string }
        found: { type: boolean }
        policy: { type: string }
        ixCount: { type: integer }
        facilityCount: { type: integer }
        peeringdbUrl: { type: string }
    CommonPeering:
      type: object
      required: [a, b, ixs, facilities]
      properties:
        a: { $ref: "#/components/schemas/PeeringSide" }
        b: { $ref: "#/components/schemas/PeeringSide" }
        ixs:
          type: array
          items:
            type: object
            required: [ixId, name, a, b, bothRs]
            properties:
              ixId: { type: integer }
              name: { type: string }
              a: { type: array, items: { $ref: "#/components/schemas/PeeringPort" } }
              b: { type: array, items: { $ref: "#/components/schemas/PeeringPort" } }
              bothRs: { type: boolean }
        facilities:
          type: array
          items:
            type: object
            required: [name, city, country, facId]
            properties:
              name: { type: string }
              city: { type: string }
              country: { type: string }
              facId: { type: integer }
