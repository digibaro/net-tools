              name: { type: string }
              org: { type: string }
              email: { type: string }
              country: { type: string }
        registrar: { type: string }
        country: { type: string }
        range: { type: string }
        type: { type: string }
        port43: { type: string }
        server: { type: string }
    DomainExpiry:
      type: object
      required: [domain, registered, expires, updated, daysLeft, registrar, status, server]
      properties:
        domain: { type: string }
        registered: { type: string }
        expires: { type: string }
        updated: { type: string }
        daysLeft: { type: [integer, "null"] }
        registrar: { type: string }
        status: { type: array, items: { type: string } }
        server: { type: string }
    Geo:
      type: object
      required: [ip, public, found, prefix, city, region, postal, country, countryCode, continent, latitude, longitude, accuracyKm, timeZone, asn, asOrg, asnSource, source, database]
      properties:
        ip: { type: string }
        public: { type: boolean }
        found: { type: boolean }
        prefix: { type: string }
        city: { type: string }
        region: { type: string }
        postal: { type: string }
        country: { type: string }
        countryCode: { type: string }
        continent: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        accuracyKm: { type: integer }
        timeZone: { type: string }
        asn: { type: [integer, "null"] }
        asOrg: { type: string }
        asnSource: { type: string, enum: ["", mmdb, cymru, ipinfo] }
        source: { type: string }
        database: { type: string }
    RemoteMeta:
      type: object
      required: [tool, vantage, type, target, locations, limit, id, probes]
      properties:
        tool: { type: string }
        vantage: { type: string }
        type: { type: string, enum: [ping, traceroute, mtr, dns, http] }
        target: { type: string }
        locations: { type: array, items: { type: string } }
        limit: { type: integer }
        id: { type: string }
        probes: { type: integer }
    RemoteProbe:
      type: object
      required: [continent, country, city, asn, network, latitude, longitude, tags]
      properties:
        continent: { type: string }
        country: { type: string }
        city: { type: string }
        asn: { type: integer }
        network: { type: string }
        latitude: { type: number }
