<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Self-hosted network tools and troubleshooting utilities">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Anti-FOUC: apply the stored theme and accent before CSS loads (favicon and boot logo follow the
         accent; the colour table mirrors ACCENT_COLORS in src/themes.ts). Its sha256 is added to the CSP
         at build time. -->
    <script>(function () { try { var m = localStorage.getItem('nettools:color-mode') || 'auto'; var d = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); var e = document.documentElement; if (d) e.classList.add('dark'); e.style.colorScheme = d ? 'dark' : 'light'; document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#18181c' : '#ffffff'); var A = {"green":["#0f7a4a","#63e2b7"],"blue":["#1d5fc7","#8cb8ff"],"indigo":["#4f46e5","#a5b4fc"],"purple":["#7e30c4","#d4adfc"],"orange":["#b4490a","#fdb47a"],"red":["#b91c32","#fda4af"]}; var a = A[localStorage.getItem('nettools:accent')] || A.green; var c = a[d ? 1 : 0]; e.style.setProperty('--nt-accent', c); document.querySelector('link[rel="icon"]').setAttribute('href', 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></svg>')) } catch (_) {} })()</script>
    <title>NET-TOOLS</title>
    <style>
      html { background: #ffffff; color: #1f2225 } html.dark { background: #101014; color: #e6e6e8 }
      /* App-shell placeholder painted before the JS bundle runs; Vue replaces it on mount. */
      .nt-boot { font: 600 18px/1 system-ui, sans-serif; display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid rgba(128, 128, 128, 0.25) }
      .nt-boot-text { font: 14px/1.5 system-ui, sans-serif; opacity: 0.7; padding: 20px }
    </style>
  </head>
  <body>
    <div id="app"><div class="nt-boot"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--nt-accent, #0f7a4a)"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></svg>NET-TOOLS</div><p class="nt-boot-text">Network tools and troubleshooting utilities</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
