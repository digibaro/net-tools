      ipip: IP-in-IP / 6in4
      ipv6-tunnel: IPv6 tunnel (4in6 / 6in6)
      ipsec-gcm: IPsec ESP tunnel, AES-GCM (IPv4)
      ipsec-cbc: IPsec ESP tunnel, AES-CBC + SHA-1 (IPv4)
      nat-t: IPsec NAT-T (UDP 4500)
      wireguard-v4: WireGuard over IPv4
