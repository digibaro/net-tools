runMode:
  browser:
    label: Browser
    description: Runs entirely in your browser; nothing is sent to the server. Works offline.
  server:
    label: Server
    description: Runs on the NetTools server, from its network vantage point.
  public-api:
    label: Public API
    description: Uses a third-party service through the NetTools server.
  hybrid:
    label: Hybrid
    description: Runs on the server by default, with an optional public-service mode.
capabilities:
  disabledTitle: This tool is unavailable
  reasons:
    disabled_by_admin: Disabled by the administrator.
    provider_key_missing: Requires an API key that is not configured on the server.
    requires_lan_mode: Requires LAN mode (host networking) on the server.
    binary_missing: A required program is not installed on the server.
    data_missing: A required data file (for example the GeoIP database) is not installed on the server.
    api_unreachable: The NetTools server cannot be reached. Browser-only tools still work.
    unavailable: Not available on this server.
