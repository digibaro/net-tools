    hints:
      via: A Via header is present (added by HTTP proxies).
      forwarded: A Forwarded header is present (RFC 7239, added by proxies).
      multi-hop: X-Forwarded-For lists more than one hop, so another proxy forwarded the request before NetTools.
      cdn: CDN headers are present (Cloudflare, Akamai, Fastly, CloudFront or Azure Front Door).
      compression-stripped: Accept-Encoding is missing, which is typical for intercepting proxies and antivirus scanners.
    columns:
      name: Header
      value: Value
      note: Note
    fields:
      ip: Client address
      protocol: Protocol
      method: Method
