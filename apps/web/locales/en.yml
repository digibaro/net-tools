    encapsulations: Encapsulations
    count: 'Number of {layer}'
    invalid: The overhead is larger than the link MTU allows.
    ipv6Minimum: The inner MTU is below 1280 bytes, the minimum IPv6 requires (RFC 8200).
    layers:
