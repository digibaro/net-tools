name: Release

# Push a tag like v0.4.0 (on main) to publish multi-arch images to GHCR and a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: image ${{ matrix.image }} (amd64+arm64 → GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [web, api]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags: the previous release is the "new" badge baseline
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tags
        id: meta
        run: |
          v="${GITHUB_REF_NAME#v}"
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nettools-${{ matrix.image }}"
          {
            echo "version=$v"
            prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
            if [ -n "$prev" ]; then echo "release=${prev#v}@$(git log -1 --format=%cs "$prev")"; fi
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            echo "$img:$v"
            case "$v" in
              *-*) ;;                                # pre-release: only its exact tag
              *) echo "$img:${v%.*}"; echo "$img:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            LATEST_RELEASE=${{ steps.meta.outputs.release }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=nettools-${{ matrix.image }}
            org.opencontainers.image.description=NET-TOOLS ${{ matrix.image }} — self-hosted network tools
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          args=(--verify-tag --title "NET-TOOLS ${GITHUB_REF_NAME}")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
