# Included in every location that sets its own add_header (nginx drops inherited add_header there).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Phase 1 adds 'sha256-<theme-script-hash>' to script-src for the inline anti-FOUC script (docs/THEMING.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.ipify.org https://api6.ipify.org https://cloudflare-dns.com https://dns.google; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
# Empty value (ENABLE_HSTS=false) means nginx omits the header.
add_header Strict-Transport-Security $nettools_hsts always;
