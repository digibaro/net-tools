# Included in every location that sets its own add_header (nginx drops inherited add_header there).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# docker/web.Dockerfile appends the sha256 of each inline script (anti-FOUC theme script, docs/THEMING.md)
# to script-src at build time.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.ipify.org https://api6.ipify.org https://cloudflare-dns.com https://dns.google ws: wss:; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
# Empty value (ENABLE_HSTS=false) means nginx omits the header.
add_header Strict-Transport-Security $nettools_hsts always;
